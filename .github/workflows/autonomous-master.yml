name: Autonomous Website Sync & Auto Deploy

on:
  schedule:
    # Run every 6 hours to scan SunnyLink, SunnyPilot, GitHub manifests, and Discourse/Discord sentiment
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force full upstream resync even if cached SHAs match'
        required: false
        default: false
        type: boolean
      force_deploy:
        description: 'Force Cloud Run deployment even if no data files changed'
        required: false
        default: false
        type: boolean

concurrency:
  group: autonomous-website-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  autonomous-sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          pip install requests google-auth

      - name: Run Master Autonomous Sync Pipeline
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.force_sync }}" = "true" ]; then
            node scripts/autonomous_sync.mjs --force
          else
            node scripts/autonomous_sync.mjs
          fi

      - name: Run verification and localization integrity tests
        if: steps.sync.outputs.changed == 'true' || inputs.force_deploy == true
        run: |
          npm test
          node scripts/check-i18n.mjs --data-only

      - name: Commit and push updated datasets
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ locales/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(autonomy): sync upstream settings, models, and community sentiment [skip ci]"
          git pull --rebase origin main || true
          git push

      - name: Deploy to Cloud Run
        if: steps.sync.outputs.deploy_needed == 'true' || inputs.force_deploy == true
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          mkdir -p ~/.config/gcp
          echo "$GCP_SA_KEY" > ~/.config/gcp/sunnylink-wiki-key.json
          python3 scripts/deploy.py
