steps:
  # 1. Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/wiki-app:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/wiki-app:latest'
      - '--build-arg'
      - 'NEXT_PUBLIC_GOOGLE_SCRIPT_URL=${_NEXT_PUBLIC_GOOGLE_SCRIPT_URL}'
      - '.'

  # 2. Push both tags
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/wiki-app']

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'wiki-app'
      - '--image'
      - 'gcr.io/$PROJECT_ID/wiki-app:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'
      - '--set-env-vars'
      - 'NEXT_PUBLIC_GOOGLE_SCRIPT_URL=${_NEXT_PUBLIC_GOOGLE_SCRIPT_URL}'

images:
  - 'gcr.io/$PROJECT_ID/wiki-app:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/wiki-app:latest'

substitutions:
  _REGION: us-central1
  _NEXT_PUBLIC_GOOGLE_SCRIPT_URL: ''

options:
  logging: CLOUD_LOGGING_ONLY
